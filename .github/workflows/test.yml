name: Test fraud pipeline
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_SOURCE: demo
      DAGS_PAUSED: "false"
      DAG_SCHEDULE: manual
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: |
          mkdir -p artifacts/models artifacts/reports results
          chmod -R 777 artifacts results
          docker compose config -q
          docker compose build
          docker compose up -d --wait --wait-timeout 600
      - name: Unit and database tests
        run: docker compose run --rm tests
      - name: DAG imports
        run: docker compose exec -T airflow python /opt/airflow/scripts/check_dags.py
      - name: Manual runs, hot reload and scheduled runs
        run: python3 scripts/smoke_test.py
      - name: Logs
        if: always()
        run: |
          docker compose ps -a > results/containers.txt
          docker compose logs --no-color > results/compose.log
          docker compose exec -T airflow airflow dags list-import-errors > results/import-errors.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            results/
            artifacts/reports/
            artifacts/models/*.json
      - name: Stop
        if: always()
        run: docker compose down -v
